<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="./css/register.css">
</head>

<body>
  <div class="line"></div>
  <div class="content">

    <h1 class="fristTitle">FLOWTECH <span>B2B</span></h1>
    <div class="x_line"></div>
    <h1 class="lastTitle">Plataforma para <br> empresas</h1>
    <p>Versao 1.0 &copy; Flowtech. 2026</p>
  </div>
  <div class="content">
    <form>
      <h1>Face seu login</h1>

      <div class="inputBox">
        <img src="./assets/icons/mail.svg" alt="">
        <input id="email" name="email" type="email" placeholder="douglas@gmail.com">
      </div>

      <div class="inputBox">
        <img src="./assets/icons/lock.svg" alt="">
        <input id="pass" name="password" class="password_inp" type="password" placeholder="•••••••••••••••••••">
        <img class="eye" src="./assets/icons/eye.svg" alt="">
        <img class="eye_slash" src="./assets/icons/eye-slash.svg" alt="">
      </div>

      <div class="checkBox">
        <input id="chek" type="checkbox">
        <label class="label" for="chek">Remember me</label>
      </div>

      <input class="btn" type="submit" value="enter">

      <div class="link">
        <a href="./register.html">creat-acaunt</a>
      </div>
    </form>
  </div>

  <script src="./js/login.js"></script>
</body>

</html>
