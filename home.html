<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <img src="./assets/icons/logo.svg" alt="">
        <div class="innerHead">
            <div class="inputBox">
                <img src="./assets/icons/search.svg" alt="">
                <input id="search" type="search" name="" placeholder="Search..">
            </div>

            <div class="profil">
                <img src="./assets/icons/avatar.svg" alt="">
                <span>X'eriya Ponald</span>
            </div>
        </div>
    </header>

    <nav>
        <ul>
            <li><img src="./assets/icons/dashboard.svg" alt="">
                <span>Dashboard</span>
            </li>
            <li>
                <img src="./assets/icons/product.svg" alt="">
                <span>Products</span>
            </li>
            <li>
                <img src="./assets/icons/Categories.svg" alt="">
                <span>Categories</span>
            </li>
        </ul>
    </nav>

    <main>
        <div class="titleWrapper">
            <h1>Product</h1>
            <div class="filtered">
                <select id="filter">
                    <option value="id" selected >Id</option>
                    <option value="full_name">full Name</option>
                    <option value="phone_number">Phone number</option>
                    <option value="date">Brithday</option>
                    <option value="address">Address</option>
                    <option value="course">Course</option>

                </select>
                <button id="add"><img src="./assets/icons/plus.svg" alt="">Add Products</button>
            </div>
        </div>

        <div class="tableWrapper">
            <table >
                <thead>
                    <tr class="tr" >
                        <th>ID</th>
                        <th>Ism familya</th>
                        <th>Telefon raqam</th>
                        <th>Tug'ilgan sana</th>
                        <th>Manzil</th>
                        <th>Kurs yonalishi</th>
                        <th>O'chirish</th>
                        <th>Taxrirlash</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </main>

    <div class="modal">
        <div class="titleWrapper">
            <p>Create a product</p>
            <img id="closeIcon" src="./assets/icons/x-circle.svg" alt="">
        </div>

        <form id="form">
            <div class="box">
                <label>Full name</label>
                <input class="fUllName" type="text" placeholder="Ali Valiyev">
            </div>

            <div class="box">
                <label>Phone number</label>
                <input class="phoneNumber" type="number" placeholder="997770707">
            </div>
            <div class="box">
                <label>Brithday</label>
                <input class="brithday" type="date">
            </div>
            <div class="box">
                <label>Address</label>
                <select class="address">
                    <option selected value="Namangan">Namangan</option>
                    <option value="Andijon">Andijon</option>
                    <option value="Buxoro">Buxoro</option>
                </select>
            </div>
            <div class="box">
                <label>course</label>
                <select class="course">
                    <option selected value="Web developer">Web developer</option>
                    <option value="English">English</option>
                    <option value="Design">Design</option>
                    <option value="Cybr securitybr">Cybr security</option>
                </select>
            </div>

            <div class="box">
                <button id="close">CLose</button>
                <button id="submit">Submit</button>
            </div>
        </form>
    </div>

    <div class="blur"></div>

    <script src="./js/hom.js"></script>
</body>

</html>
